<title>Napworld</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IM+Fell+English:ital@0;1&display=swap">
<style>
:root { color-scheme: dark; }
:root {
  --bg: #14181f; --panel: #1d232d; --panel2: #262e3b; --ink: #e8e2d0; --muted: #9aa3b2; --gold: #d8b45a; --gold2: #f1d487;
  --red: #d9534f; --green: #5cb85c; --parch: #e9dfc2; --parch-ink: #2a2118; --line: #3a4455;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
#app { position: fixed; inset: 0; }
[hidden] { display: none !important; }
button { font: inherit; color: var(--ink); background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; cursor: pointer; }
button:hover:not(:disabled) { background: #323d4e; border-color: var(--gold); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: linear-gradient(#e0bd63, #b8913c); color: #231a05; border-color: #f1d487; font-weight: 700; }
button.primary:hover:not(:disabled) { background: linear-gradient(#f1d487, #cfa64a); }
button.danger { border-color: #8a3a3a; }
button.danger:hover:not(:disabled) { background: #6a2a2a; border-color: var(--red); }
kbd { font: 10px monospace; background: rgba(255,255,255,.12); border-radius: 3px; padding: 0 3px; margin-left: 3px; }
select, input[type=text] { background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; font: inherit; }
.good { color: var(--green); } .bad { color: var(--red); } .muted { color: var(--muted); }

/* ---------- start screen ---------- */
#start { position: absolute; inset: 0; overflow: auto; padding: 28px 24px 60px; background: radial-gradient(ellipse at top, #263044 0%, #14181f 70%); }
#start h1 { margin: 0; font: 700 44px 'Cinzel', 'IM Fell English', Georgia, serif; letter-spacing: 6px; color: var(--gold2); text-align: center; text-shadow: 0 2px 12px #000; }
#start .sub { text-align: center; color: var(--muted); margin: 6px 0 22px; font-style: italic; }
#start .opts { display: flex; gap: 14px; justify-content: center; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; max-width: 1200px; margin: 0 auto; }
.card { background: var(--panel); border: 1px solid var(--line); border-left: 6px solid var(--c); border-radius: 6px; padding: 10px 12px; cursor: pointer; transition: transform .1s; }
.card:hover { transform: translateY(-2px); border-color: var(--gold); border-left-color: var(--c); }
.card.sel { outline: 2px solid var(--gold); background: var(--panel2); }
.card h3 { margin: 0 0 2px; font: 700 17px 'IM Fell English', Georgia, serif; }
.card .leader { color: var(--gold); font-size: 12px; }
.card p { margin: 6px 0; color: #c9c3b0; font-size: 12.5px; }
.card .stats { display: flex; gap: 10px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.card .diff { font-size: 11px; letter-spacing: 1px; }
#startbar { position: sticky; bottom: 0; text-align: center; padding: 14px; background: linear-gradient(transparent, #14181f 40%); margin-top: 14px; }

/* ---------- game ---------- */
#game { position: absolute; inset: 0; display: flex; flex-direction: column; }
#topbar { display: flex; align-items: center; gap: 14px; padding: 6px 12px; background: linear-gradient(#242c3a, #181d27); border-bottom: 2px solid var(--gold); flex-wrap: wrap; z-index: 5; }
#topbar .flag { width: 22px; height: 22px; border-radius: 4px; border: 2px solid #000; }
#topbar .fname { font: 700 16px 'IM Fell English', Georgia, serif; color: var(--gold2); }
#topbar .stat { padding: 2px 10px; background: rgba(0,0,0,.28); border-radius: 4px; white-space: nowrap; }
#topbar .stat small { color: var(--muted); }
#topbar .spacer { flex: 1; }
#topbar .date { font: 700 15px 'IM Fell English', Georgia, serif; }
#endturn { padding: 8px 20px; font-size: 15px; }
#mapwrap { position: relative; flex: 1; min-height: 0; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
#map.drag { cursor: grabbing; }
#tip { position: absolute; background: rgba(15,18,24,.92); border: 1px solid var(--gold); padding: 4px 8px; border-radius: 4px; font-size: 12px; pointer-events: none; z-index: 4; white-space: nowrap; }
#hint { position: absolute; left: 10px; bottom: 6px; font-size: 11px; color: rgba(255,255,255,.85); text-shadow: 0 1px 3px #000; pointer-events: none; }

#side { position: absolute; top: 44px; right: 8px; max-height: calc(100% - 52px); width: 272px; max-width: 40vw; overflow-y: auto; font-size: 12.5px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.5); padding: 0; z-index: 3; }
#side .ph { padding: 10px 12px; border-bottom: 3px solid var(--c, var(--gold)); background: linear-gradient(var(--panel2), var(--panel)); }
#side .ph h2 { margin: 0; font: 700 19px 'IM Fell English', Georgia, serif; }
#side .ph .own { font-size: 12px; color: var(--muted); }
#side .sec { padding: 8px 12px; border-bottom: 1px solid var(--line); }
#side .sec h4 { margin: 0 0 6px; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold); }
#side .kv { display: flex; justify-content: space-between; font-size: 13px; }
#side .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
#side .row button { font-size: 12px; padding: 4px 8px; }
.ubtn { display: flex; justify-content: space-between; width: 100%; text-align: left; margin: 2px 0; font-size: 12px; }
.ubtn span:last-child { color: var(--muted); }
.unit { display: grid; grid-template-columns: 18px 1fr 56px; gap: 6px; align-items: center; font-size: 12px; padding: 2px 0; }
.unit .bar { height: 6px; background: #0007; border-radius: 3px; overflow: hidden; grid-column: 2 / 4; }
.unit .bar i { display: block; height: 100%; background: linear-gradient(90deg, #b8913c, #e0bd63); }
.armychip { display: flex; align-items: center; gap: 8px; padding: 4px 6px; margin: 3px 0; background: var(--panel2); border-radius: 4px; cursor: pointer; border: 1px solid transparent; font-size: 12px; }
.armychip:hover, .armychip.sel { border-color: var(--gold); }
.armychip i { width: 14px; height: 14px; border: 1px solid #000; border-radius: 2px; flex: none; }
.gen { background: rgba(216,180,90,.1); border: 1px solid rgba(216,180,90,.35); border-radius: 4px; padding: 5px 8px; font-size: 12px; margin-bottom: 6px; }
.queue { font-size: 12px; color: var(--muted); }

#log { position: absolute; left: 8px; top: 8px; width: 290px; max-width: 34vw; background: rgba(20,24,31,.88); border: 1px solid var(--line); border-radius: 8px; z-index: 3; font-size: 12px; }
#logbar { display: flex; align-items: center; gap: 10px; padding: 4px 8px; border-bottom: 1px solid var(--line); }
#logbar b { color: var(--gold); flex: 1; }
#logbar label { color: var(--muted); font-size: 11px; }
#logbar button { padding: 0 7px; }
#loglist { max-height: 130px; overflow-y: auto; padding: 4px 8px; }
#log.min #loglist { display: none; }
#loglist div { padding: 2px 0; border-bottom: 1px dotted #ffffff12; }
#loglist .t { color: var(--muted); margin-right: 4px; font-size: 10px; }
.k-war, .k-bad { color: #ff8c7a; } .k-good { color: #8fe08f; } .k-event { color: var(--gold2); } .k-peace { color: #8ec7ff; } .k-alliance { color: #8ec7ff; }
.k-war-minor, .k-battle-minor, .k-capture-minor, .k-peace-minor, .k-alliance-minor { color: #aab; font-size: 11px; opacity: .8; }

/* ---------- modals ---------- */
#modal { position: absolute; inset: 0; background: rgba(5,8,12,.62); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
.dlg { background: var(--panel); border: 2px solid var(--gold); border-radius: 10px; max-width: 760px; width: 100%; max-height: 90vh; overflow: auto; box-shadow: 0 12px 50px #000; }
.dlg h2 { margin: 0; padding: 12px 16px; font: 700 22px 'IM Fell English', Georgia, serif; color: var(--gold2); background: linear-gradient(var(--panel2), var(--panel)); border-bottom: 1px solid var(--line); }
.dlg .body { padding: 14px 16px; }
.dlg .foot { padding: 10px 16px; display: flex; gap: 8px; justify-content: flex-end; border-top: 1px solid var(--line); flex-wrap: wrap; }
.dlg.event { border-color: #f1d487; background: linear-gradient(#2a2418, #1b1710); }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--gold); padding: 4px 6px; border-bottom: 1px solid var(--line); }
table.t td { padding: 4px 6px; border-bottom: 1px solid #ffffff10; vertical-align: middle; }
table.t td .sw { display: inline-block; width: 11px; height: 11px; border: 1px solid #000; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
table.t .btns button { font-size: 11px; padding: 2px 6px; margin-right: 3px; }
.relbar { display: inline-block; width: 60px; height: 6px; background: #0007; border-radius: 3px; position: relative; vertical-align: middle; }
.relbar i { position: absolute; top: 0; bottom: 0; }
.tag { padding: 1px 6px; border-radius: 8px; font-size: 11px; }
.tag.war { background: #7a2a2a; } .tag.ally { background: #2a5a7a; } .tag.peace { background: #3a4a3a; }
.sides { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.sidebox { background: var(--panel2); border-radius: 6px; padding: 8px 10px; border-top: 4px solid var(--c); font-size: 13px; }
.sidebox h3 { margin: 0 0 4px; font-size: 14px; }
.toast { position: absolute; left: 50%; top: 70px; transform: translateX(-50%); background: rgba(0,0,0,.85); border: 1px solid var(--gold); padding: 6px 14px; border-radius: 6px; z-index: 30; pointer-events: none; }

/* ---------- battle ---------- */
#battle { position: absolute; inset: 0; background: #000; z-index: 15; display: flex; flex-direction: column; }
.b-top { flex: none; display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: linear-gradient(#242c3a, #181d27); border-bottom: 2px solid var(--gold); }
.b-side { flex: 1; display: grid; grid-template-columns: 1fr; gap: 2px; border-left: 5px solid var(--c); padding-left: 8px; font-size: 13px; }
.b-s1 { border-left: none; border-right: 5px solid var(--c); padding-right: 8px; padding-left: 0; text-align: right; }
.b-bar { height: 8px; background: #0008; border-radius: 4px; overflow: hidden; }
.b-bar i { display: block; height: 100%; background: var(--c); width: 100%; }
.b-s1 .b-bar i { margin-left: auto; }
.b-mid { text-align: center; font-weight: 700; min-width: 220px; }
.b-stage { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #1c2a16; }
#b-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
.b-banner { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(10,12,16,.88); border: 2px solid var(--gold); border-radius: 10px; padding: 18px 30px; text-align: center; max-width: 520px; }
.b-banner.hide { display: none; }
.b-banner h2 { margin: 0 0 8px; font: 700 28px 'IM Fell English', Georgia, serif; }
.b-feed { position: absolute; left: 10px; top: 10px; font-size: 12px; text-shadow: 0 1px 3px #000; pointer-events: none; max-width: 340px; }
.b-feed div { background: rgba(0,0,0,.55); padding: 2px 8px; margin-bottom: 2px; border-radius: 3px; }
.b-help { position: absolute; left: 10px; bottom: 8px; font-size: 11px; color: #fff; text-shadow: 0 1px 3px #000; pointer-events: none; }
.b-help.hide { display: none; }
.b-bottom { flex: none; display: flex; align-items: center; gap: 12px; padding: 6px 12px; background: linear-gradient(#242c3a, #181d27); border-top: 2px solid var(--gold); flex-wrap: wrap; }
.b-info { flex: 1; min-width: 240px; font-size: 13px; }
.b-btns { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.b-btns button { font-size: 12px; padding: 4px 8px; }
.b-sp.on { background: var(--gold); color: #231a05; }
.b-sep { width: 10px; }

@media (max-width: 900px) {
  #side { width: 280px; } #log { width: 260px; }
}

#minimap { position: absolute; left: 8px; bottom: 28px; width: 150px; height: 158px; opacity: .92; border: 2px solid var(--gold); border-radius: 4px; background: #7fa6b8; box-shadow: 0 4px 16px rgba(0,0,0,.5); z-index: 3; cursor: pointer; }
@media (max-height: 640px) { #minimap { width: 110px; height: 116px; } }

.b-banner.deploy { top: 70px; transform: translateX(-50%); pointer-events: none; padding: 10px 22px; background: rgba(10,12,16,.78); }
.b-banner.deploy h2 { font-size: 20px; margin-bottom: 4px; }

.b-banner.report { max-width: 900px; width: 92%; max-height: 86%; overflow: auto; text-align: left; }
.b-banner.report h2 { text-align: center; } .b-banner.report p { text-align: center; }
.rep-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.rep-cols h4 { margin: 4px 0; } .b-banner.report table.t { font-size: 12px; }
.b-replaybar { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(10,12,16,.85); border: 1px solid var(--gold); padding: 6px 14px; border-radius: 6px; font-weight: 700; letter-spacing: 1px; }
@media (max-width: 800px) { .rep-cols { grid-template-columns: 1fr; } }

.b-tip { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); max-width: 640px; background: rgba(20,26,36,.94); border: 2px solid var(--gold); border-radius: 8px; padding: 10px 34px 10px 14px; font-size: 13.5px; z-index: 4; box-shadow: 0 6px 24px #000a; }
.b-tip .tipx { position: absolute; right: 6px; top: 4px; padding: 0 7px; font-size: 16px; background: none; border: none; color: var(--muted); }
.evart { display: block; width: 100%; height: 130px; border-bottom: 2px solid #2a1c0a; }
.dlg.event h2 { border-top: none; }
.warn { color: #e8b04a; }
.bar { height: 6px; background: #0007; border-radius: 3px; overflow: hidden; margin: 2px 0 6px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, #5cb85c, #e8b04a, #d9534f); background-size: 300% 100%; }
.tut-hl { outline: 2px solid #ffd54a !important; box-shadow: 0 0 12px #ffd54a; animation: tutpulse 1.2s infinite; }
@keyframes tutpulse { 50% { box-shadow: 0 0 22px #ffe58a; } }
#coach { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); width: min(560px, 92vw); background: linear-gradient(#2a2418, #1b1710); border: 2px solid #f1d487; border-radius: 10px; padding: 12px 16px 10px; z-index: 12; box-shadow: 0 10px 40px #000c; }
#coach h3 { margin: 0 0 4px; font: 700 17px 'IM Fell English', Georgia, serif; color: var(--gold2); }
#coach .ct { font-size: 13.5px; line-height: 1.5; }
#coach .cf { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
#coach .dots { flex: 1; display: flex; gap: 4px; flex-wrap: wrap; } #coach .dots i { width: 8px; height: 8px; border-radius: 50%; background: #ffffff25; } #coach .dots i.on { background: var(--gold); } #coach .dots i.done { background: #8a7a3c; }
#coach .hintdo { color: var(--gold); font-size: 12px; }
.sumrow { display: flex; justify-content: space-between; padding: 2px 0; font-size: 13.5px; }
.sumlist { max-height: 240px; overflow-y: auto; border-top: 1px solid var(--line); margin-top: 8px; padding-top: 6px; font-size: 12.5px; }
.sumlist div { padding: 2px 0; border-bottom: 1px dotted #ffffff12; }
.termopt { display: block; padding: 6px 8px; margin: 3px 0; background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; cursor: pointer; }
.termopt:hover, .termopt.on { border-color: var(--gold); }
.termopt input { margin-right: 8px; }
.b-zoomlbl { min-width: 44px; text-align: center; font-size: 12px; color: var(--muted); }
.b-mini { position: absolute; right: 10px; bottom: 10px; width: 220px; height: 124px; border: 2px solid var(--gold); border-radius: 4px; box-shadow: 0 4px 14px #000a; cursor: pointer; z-index: 3; }
@media (max-width: 700px) { .b-mini { width: 150px; height: 85px; } }

#tt { position: fixed; z-index: 60; max-width: 340px; background: rgba(14,17,23,.97); border: 1px solid var(--gold); border-radius: 6px; padding: 8px 11px; font-size: 12.5px; line-height: 1.45; pointer-events: none; box-shadow: 0 6px 22px #000b; color: var(--ink); }
#tt .ttk { color: var(--muted); font-size: 11.5px; }
.qm { display: inline-block; width: 15px; height: 15px; line-height: 15px; text-align: center; border-radius: 50%; background: #ffffff1c; color: var(--gold2); font-size: 11px; font-weight: 700; margin-left: 4px; cursor: help; text-transform: none; letter-spacing: 0; }
.ubtn.locked { opacity: .55; }
.ubtn.locked:hover:not(:disabled) { border-color: var(--line); background: var(--panel2); }
.subh { margin: 8px 0 3px; font-size: 10.5px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); }
.gold { color: var(--gold2); }
.guidebox { max-width: 1000px; margin: 0 auto 16px; background: #1d2431; border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 6px; padding: 10px 14px; font-size: 13.5px; line-height: 1.55; }
.tier { display: inline-block; padding: 1px 9px; border-radius: 10px; font-size: 11.5px; font-weight: 700; letter-spacing: .5px; color: #10140c; }
.tier-beginner { background: #6fd08a; } .tier-easy { background: #a8dc7a; } .tier-medium { background: #e8cd5a; } .tier-hard { background: #eb9a4a; } .tier-expert { background: #e5655e; color: #1c0a0a; }
.card { position: relative; }
.card .ribbon { position: absolute; top: -9px; right: 10px; background: linear-gradient(#e0bd63, #b8913c); color: #231a05; font-size: 11px; font-weight: 800; letter-spacing: .6px; padding: 2px 9px; border-radius: 3px; text-transform: uppercase; }
.card .why { font-size: 12px; color: #d4cdb6; }

/* battle: pause banner, objectives HUD */
.b-paused { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(20,24,34,0.85); border: 1px solid #7cf; color: #cfe6ff; padding: 5px 16px; border-radius: 4px; font-size: 13px; letter-spacing: .08em; pointer-events: none; z-index: 4; }
.b-paused[hidden] { display: none; }
#b-obj { font-size: 12px; opacity: .95; }
#b-obj .ob { margin: 0 2px; font-size: 13px; }
#b-obj .ob-1 { color: #ddd; } #b-obj .ob0 { color: #6af; } #b-obj .ob1 { color: #f66; }
#b-obj .ob-1 { color: #ddd; }
.good { color: #6d6; } .bad { color: #e66; }

/* campaign: attention panel, buttons */
#b-att.attn { border-color: #e8b04a; color: #ffd98a; }
.attrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 4px 0; border-bottom: 1px solid #ffffff14; font-size: 13px; }
.attrow.sev3 span { color: #ff9a8a; } .attrow.sev2 span { color: #ffd98a; }
#tip { white-space: normal; max-width: 260px; line-height: 1.35; }
button.on { border-color: #6c6; }

.perks { list-style: none; margin: 6px 0; padding: 0; font-size: 12px; }
.perks li { padding-left: 16px; position: relative; margin: 2px 0; }
.perks li::before { position: absolute; left: 2px; font-weight: 700; }
.perks .pl { color: #8fd68f; } .perks .pl::before { content: "+"; }
.perks .mi { color: #e89a8a; } .perks .mi::before { content: "\2212"; }

.navalopt { max-width: 760px; margin: 10px auto 0; padding: 8px 14px; border: 1px solid var(--line); border-radius: 6px; background: rgba(0,0,0,.18); text-align: left; font-size: 13px; }
.navalopt .muted { margin-top: 4px; font-size: 12px; line-height: 1.45; }

/* compact side panel */
#side.hide { display: none; }
#sidetoggle { position: absolute; top: 8px; right: 8px; z-index: 4; padding: 4px 10px; font-size: 12px; }
#side .ph { padding: 7px 10px; } #side .ph h2 { font-size: 17px; }
#side .sec { padding: 6px 10px; }
#side .sec h4 { margin-bottom: 4px; }
#side .kv { font-size: 12px; }
#side .ubtn { padding: 2px 7px; margin: 1px 0; font-size: 12px; }
#side .subh { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin: 4px 0 2px; }
#side [data-fold] > h4 { cursor: pointer; user-select: none; }
#side [data-fold] > h4::before { content: "\25BE "; }
#side [data-fold].folded > h4::before { content: "\25B8 "; }
#side [data-fold].folded > :not(h4) { display: none; }
#phasebanner { position: absolute; top: 52px; left: 50%; transform: translateX(-50%); z-index: 6; padding: 6px 18px; background: rgba(15,18,24,.92); border: 2px solid var(--c, var(--gold)); border-radius: 6px; font: 700 16px 'IM Fell English', Georgia, serif; color: #fff; pointer-events: none; box-shadow: 0 4px 18px rgba(0,0,0,.5); }
#phasebanner[hidden] { display: none; }
#playsel { font-size: 12px; padding: 3px 4px; }

/* title screen and nation selection */
#start.title { display: flex; align-items: center; justify-content: center; padding: 0; background: radial-gradient(ellipse at 50% 30%, #2d3a52 0%, #14181f 72%); }
#start .titlebox { text-align: center; }
#start.title h1 { font-size: 64px; letter-spacing: 12px; }
#start.title .sub { font-size: 16px; margin: 10px 0 36px; }
#start .menu { display: flex; flex-direction: column; gap: 10px; width: 280px; margin: 0 auto; }
#start .menu button { padding: 11px 16px; font-size: 16px; }
#start .navbar { display: grid; grid-template-columns: 120px 1fr 120px; align-items: center; margin-bottom: 8px; }
#start .navbar h1 { font-size: 30px; letter-spacing: 3px; }

/* NAPWORLD - procedural sound effects and music (WebAudio, no asset files) */
(function () {
  const NAP = window.NAP;
  const KEY = 'napworld-audio-v1';
  const A = (NAP.audio = { ctx: null, muted: false, mode: 'off', last: {}, beat: 0, nextT: 0, timer: null });
  try { A.muted = JSON.parse(localStorage.getItem(KEY) || '{}').muted === true; } catch (e) {}

  A.init = function () {
    if (A.ctx) { if (A.ctx.state === 'suspended') A.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    A.ctx = new AC();
    A.master = A.ctx.createGain(); A.master.gain.value = A.muted ? 0 : 0.8; A.master.connect(A.ctx.destination);
    A.sfxBus = A.ctx.createGain(); A.sfxBus.gain.value = 0.7; A.sfxBus.connect(A.master);
    A.musBus = A.ctx.createGain(); A.musBus.gain.value = 0.28; A.musBus.connect(A.master);
    // shared noise buffer
    const n = A.ctx.sampleRate * 1.5, buf = A.ctx.createBuffer(1, n, A.ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    A.noise = buf;
    A.startMusicLoop();
  };
  A.setMuted = function (m) {
    A.muted = m;
    try { localStorage.setItem(KEY, JSON.stringify({ muted: m })); } catch (e) {}
    if (A.master) A.master.gain.value = m ? 0 : 0.8;
  };
  // throttle: only play if `gap` seconds have passed since last time for this key
  function ok(key, gap) {
    const t = performance.now() / 1000;
    if (A.last[key] && t - A.last[key] < gap) return false;
    A.last[key] = t; return true;
  }
  function noiseBurst(t, dur, freq, type, gain, bus) {
    const c = A.ctx, s = c.createBufferSource(); s.buffer = A.noise; s.playbackRate.value = 0.6 + Math.random() * 0.8;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = c.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(bus || A.cur || A.sfxBus); s.start(t, Math.random() * 0.5, dur + 0.05);
  }
  function tone(t, freq, dur, type, gain, bus, slideTo) {
    const c = A.ctx, o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(bus || A.cur || A.sfxBus); o.start(t); o.stop(t + dur + 0.05);
  }
  const SFX = {
    click: (t) => tone(t, 880, 0.05, 'triangle', 0.08),
    cannon: (t) => { noiseBurst(t, 0.5, 260, 'lowpass', 0.9); tone(t, 90, 0.5, 'sine', 0.8, null, 38); },
    musket: (t) => { noiseBurst(t, 0.07, 2600, 'highpass', 0.35); },
    volley: (t) => { for (let i = 0; i < 6; i++) noiseBurst(t + i * 0.035 + Math.random() * 0.03, 0.09, 2200, 'highpass', 0.28); },
    charge: (t) => { tone(t, 392, 0.22, 'sawtooth', 0.12); tone(t + 0.22, 523, 0.42, 'sawtooth', 0.14); },
    rout: (t) => tone(t, 330, 0.5, 'triangle', 0.1, null, 150),
    drum: (t) => { tone(t, 120, 0.18, 'sine', 0.5, null, 50); noiseBurst(t, 0.1, 1500, 'bandpass', 0.15); },
    roll: (t) => { for (let i = 0; i < 6; i++) { noiseBurst(t + i * 0.05, 0.07, 1800, 'bandpass', 0.18); } tone(t, 110, 0.3, 'sine', 0.35, null, 60); },
    fanfare: (t) => { [392, 494, 587, 784].forEach((f, i) => tone(t + i * 0.16, f, i === 3 ? 0.9 : 0.22, 'sawtooth', 0.1)); },
    defeat: (t) => { [330, 311, 262, 196].forEach((f, i) => tone(t + i * 0.28, f, 0.5, 'triangle', 0.12)); },
    bugle: (t) => { tone(t, 466, 0.16, 'sawtooth', 0.12); tone(t + 0.19, 622, 0.16, 'sawtooth', 0.12); tone(t + 0.38, 784, 0.55, 'sawtooth', 0.14); },
    hooves: (t) => { for (let i = 0; i < 6; i++) { noiseBurst(t + i * 0.065, 0.05, 420, 'lowpass', 0.2); tone(t + i * 0.065, 75, 0.06, 'sine', 0.2); } },
    bell: (t) => { tone(t, 660, 1.2, 'sine', 0.1); tone(t, 1320, 0.8, 'sine', 0.04); }
  };
  // opts: { pan: -1..1, vol: 0..1 } for positional sound
  A.sfx = function (name, gap, opts) {
    if (!A.ctx || A.muted) return;
    if (gap && !ok('s:' + name, gap)) return;
    let node = null;
    if (opts && (opts.pan || opts.vol !== undefined)) {
      const g = A.ctx.createGain(); g.gain.value = opts.vol === undefined ? 1 : opts.vol;
      if (A.ctx.createStereoPanner) { const p = A.ctx.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, opts.pan || 0)); g.connect(p); p.connect(A.sfxBus); } else g.connect(A.sfxBus);
      node = g;
    }
    A.cur = node;
    try { SFX[name](A.ctx.currentTime + 0.001); } catch (e) { /* ignore */ }
    A.cur = null;
  };

  // ---- generative music: drone + marching drum, two moods
  const SCALE = { map: [0, 2, 3, 7, 5, 3, 2, 0], battle: [0, 0, 3, 0, 5, 3, 2, 0] };
  A.music = function (mode) { A.mode = mode; };
  A.startMusicLoop = function () {
    if (A.timer) return;
    A.nextT = A.ctx.currentTime + 0.2;
    A.timer = setInterval(() => {
      if (!A.ctx || A.muted || A.mode === 'off' || A.ctx.state !== 'running') { if (A.ctx) A.nextT = Math.max(A.nextT, A.ctx.currentTime); return; }
      const bpm = A.mode === 'battle' ? 118 : 84, step = 60 / bpm / 2;
      while (A.nextT < A.ctx.currentTime + 0.4) {
        const t = A.nextT, b = A.beat % 16;
        // drums
        if (b % 4 === 0) { tone(t, 100, 0.15, 'sine', A.mode === 'battle' ? 0.5 : 0.28, A.musBus, 45); }
        if (b % 4 === 2 || (A.mode === 'battle' && b % 2 === 1)) noiseBurst(t, 0.07, 1700, 'bandpass', A.mode === 'battle' ? 0.2 : 0.1, A.musBus);
        // drone / bass line every 4 steps
        if (b % 4 === 0) {
          const root = 55 * Math.pow(2, SCALE[A.mode][(A.beat >> 2) % 8] / 12);
          tone(t, root, step * 4 * 1.1, 'sawtooth', 0.09, A.musBus);
          tone(t, root * 1.5, step * 4 * 1.1, 'triangle', 0.06, A.musBus);
        }
        // fife-ish melody in map mode
        if (A.mode === 'map' && b % 8 === 6) tone(t, 220 * Math.pow(2, [0, 3, 7, 10, 12][(A.beat >> 3) % 5] / 12), step * 3, 'triangle', 0.05, A.musBus);
        A.beat++; A.nextT += step;
      }
    }, 120);
  };

  // first user gesture unlocks audio
  const unlock = () => { A.init(); };
  window.addEventListener('pointerdown', unlock, { once: false });
  window.addEventListener('keydown', unlock, { once: false });
  document.addEventListener('click', (e) => { const b = e.target.closest && e.target.closest('button'); if (b && !b.dataset.nosound) A.sfx('click', 0.04); }, true);
})();

/* NAPWORLD - world generation (province raster from coastline polygons) and map rendering */
(function () {
  const NAP = window.NAP;
  const { W, H, cs } = NAP.MAP;
  const gw = Math.ceil(W / cs), gh = Math.ceil(H / cs);

  function hexToRgb(h) {
    const n = parseInt(h.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  NAP.hexToRgb = hexToRgb;

  // Coast detail: projected points get seeded midpoint displacement (natural wobble) then Chaikin smoothing
  const coastCache = new WeakMap();
  function coastPts(flat) {
    let r = coastCache.get(flat); if (r) return r;
    let pts = []; for (let i = 0; i < flat.length; i += 2) pts.push(NAP.proj(flat[i], flat[i + 1]));
    let seed = 1234567 + flat.length * 31; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647) - 0.5;
    for (let pass = 0; pass < 3; pass++) {
      const out = [];
      for (let i = 0; i < pts.length; i++) {
        const a = pts[i], b = pts[(i + 1) % pts.length], dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy);
        out.push(a);
        if (len > 4) { const k = rnd() * 0.3 * len * (pass === 0 ? 1 : pass === 1 ? 0.6 : 0.4); out.push([(a[0] + b[0]) / 2 - dy / len * k, (a[1] + b[1]) / 2 + dx / len * k]); }
      }
      pts = out;
    }
    for (let pass = 0; pass < 3; pass++) { // Chaikin corner cutting
      const out = [];
      for (let i = 0; i < pts.length; i++) {
        const a = pts[i], b = pts[(i + 1) % pts.length];
        out.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25], [a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]);
      }

    ctx.beginPath();

    ctx.closePath();
  }

  // Binary min-heap on (cost, index)
  class Heap {
    constructor() { this.c = []; this.v = []; }
    push(cost, val) {
      const c = this.c, v = this.v; let i = c.length;
      c.push(cost); v.push(val);

    if (!army.units.length) removeArmy(army);
    return { ok: false, text: 'The assault failed with heavy losses.' };
  };
  C.garrisonStrength = (pid) => { const ps = S.provinces[pid]; return Math.round((500 + 450 * ps.fort) * (1 + 0.25 * ps.fort)); };

  // -------------------------------------------------------------------- battles
  const TERRAIN_DEF = { p: 1.0, h: 1.15, f: 1.1, m: 1.25 };
  function genBonus(armies) {
    let best = null;
    for (const a of armies) if (a.general) { const g = S.generals[a.general]; if (!best || g.lead + g.atk > best.lead + best.atk) best = g; }
    return best;
  }
  function sidePower(armies, extraMul) {
    let p = 0;
    for (const a of armies) for (const u of a.units) p += u.men * U[u.type].power * (1 + 0.06 * C.vetOf(u)) * F(a.owner).morale * (C.provincesOf(a.owner).length <= 4 && a.owner !== 'minor' ? 1.15 : 1) * (1 - (a.fatigue || 0) / 250); // last stand, tiredness
    const g = genBonus(armies);
    return p * (1 + (g ? (g.atk + g.def + g.lead - 9) * 0.03 : 0)) * (extraMul || 1);
  }
  function applyCasualties(armies, frac) {
    for (const a of armies) {
      for (const u of a.units) {
        const f = clamp(frac * (0.8 + rnd() * 0.4), 0, 0.97);
        u.men = Math.round(u.men * (1 - f));
      }
      a.units = a.units.filter((u) => u.men >= Math.max(15, u.max * 0.08));
    }
  }
  function spawnColonel(f) {
    const names = (NAP.COLONEL_NAMES[f] || ['Colonel Local']).filter((n) => !Object.values(S.generals).some((g) => g.name === n));
    if (!names.length) return;
    const id = S.nextGen++, nm = names[Math.floor(rnd() * names.length)];
    const g = { id, name: nm, owner: f, atk: 2 + Math.floor(rnd() * 2), def: 2 + Math.floor(rnd() * 2), lead: 2 + Math.floor(rnd() * 2), from: S.year, trait: 'Rising colonel', xp: 0, lvl: 1, alive: true, assigned: null, arrived: true, loyalty: 82, idle: 0 };
    g.traits = deriveTraits(g); S.generals[id] = g; S.pool[f].push(id);
    plog(`Colonel ${nm} distinguishes himself and is promoted to general.`, 'good', [f]);
  }
  function award(armies, victory) {
    if (victory && armies.length && rnd() < 0.14) spawnColonel(armies[0].owner);
    for (const a of armies) {
      if (victory) for (const u of a.units) u.xp = (u.xp || 0) + 1;
      for (const u of a.units) { u.fights = (u.fights || 0) + 1; if (u.type === 'militia' && u.fights === C.MILITIA_FIGHTS && a.owner === S.player) plog('A militia regiment has seen enough battles to be drilled into line infantry (free upgrade in the army panel).', 'good', [a.owner]); }
      if (!a.general) continue;
      const g = S.generals[a.general];
      g.loyalty = Math.max(0, Math.min(100, (g.loyalty || 70) + (victory ? 4 : -6)));
      g.xp += victory ? 30 : 10;
      const need = [0, 40, 100, 200, 350, 550, 800][g.lvl] || 9999;
      if (g.xp >= need && g.lvl < 7) {
        g.lvl++;
        const stat = ['atk', 'def', 'lead'][Math.floor(rnd() * 3)];
        if (g[stat] < 7) g[stat]++;
        plog(`${g.name} is promoted to level ${g.lvl}!`, 'good', [g.owner]);
      }
    }
  }
  function killGeneral(a, fromBattle) {
    if (!a.general) return;
    const g = S.generals[a.general];
    g.alive = false; g.assigned = null; a.general = null;
    plog(`${g.name} has been killed in action!`, 'bad', [g.owner]);
  }
  function retreat(a, fromProv, enemyFacs) {
    // Retreat to the province we came from if safe, else own territory, else anywhere safe
    const bad = (q) => S.armies.some((x) => x.prov === q && enemyFacs.includes(x.owner));
    a.path = [];
    const cands = nbrs(a.owner, a.prov).filter((q) => !bad(q) && !isSea(a.prov, q));
    let dest = null;
    if (fromProv && fromProv === a.prov) return true; // attacker repulsed: stays where it started
    if (fromProv && cands.includes(fromProv)) dest = fromProv;
    if (!dest) dest = cands.find((q) => S.provinces[q].owner === a.owner) || cands[0] || null;
    if (!dest) { removeArmy(a); return false; }
    a.prov = dest; a.from = dest;
    return true;
  }

  function pickWeather() {
    const r = rnd(), winter = S.month === 12 || S.month <= 2;
    if (winter) return r < 0.4 ? 'snow' : r < 0.55 ? 'fog' : r < 0.65 ? 'rain' : 'clear';
    return r < 0.62 ? 'clear' : r < 0.82 ? 'rain' : 'fog';
  }
  function pickTod() { const r = rnd(); return r < 0.2 ? 'dawn' : r < 0.8 ? 'day' : 'dusk'; }

  async function resolveBattle(attacker, prov, from) {
    const ps = S.provinces[prov];
    const here = S.armies.filter((x) => x.prov === prov && x !== attacker);
    const defs = here.filter((x) => atWar(x.owner, attacker.owner));
    const friends = here.filter((x) => x.owner === attacker.owner || allied(x.owner, attacker.owner));
    const sideA = [attacker, ...friends], sideD = defs;
    const facsA = [...new Set(sideA.map((a) => a.owner))], facsD = [...new Set(sideD.map((a) => a.owner))];
    const playerA = facsA.includes(S.player), playerD = facsD.includes(S.player);
    // Fort/terrain bonuses
    const fortOwner = ps.owner;
    const fortSideIsA = facsA.some((f) => f === fortOwner || allied(f, fortOwner));
    const fortSideIsD = facsD.some((f) => f === fortOwner || allied(f, fortOwner));
    const terr = C.def(prov).terrain;
    let result = null;
    const involved = playerA || playerD;
    let choice = 'auto';
    if (involved && H().runBattle) {
      S.pendingWeather = pickWeather(); S.pendingTod = pickTod();
      choice = await H().askBattle({ weather: S.pendingWeather, tod: S.pendingTod, prov, sideA, sideD, attackerSide: 0, playerIsAttacker: playerA, terrain: terr, fort: ps.fort, fortSide: fortSideIsD ? 'D' : fortSideIsA ? 'A' : null });
    }
    let winner; // 'A' | 'D'
    let fieldCasualtiesApplied = false;
    if (choice === 'fight') {
      const pSide = playerA ? sideA : sideD, eSide = playerA ? sideD : sideA;
      const spec = {
        terrain: terr, provName: C.def(prov).name, weather: S.pendingWeather || 'clear', tod: S.pendingTod || 'day', month: S.month,
        playerIsAttacker: playerA,
        fort: ps.fort,
        fortSide: (playerA ? fortSideIsA : fortSideIsD) ? 0 : ((playerA ? fortSideIsD : fortSideIsA) ? 1 : -1),
        sides: [mkSide(pSide), mkSide(eSide)]
      };
      result = await H().runBattle(spec);
      if (result) {
        const pw = result.winner === 0;
        winner = (pw && playerA) || (!pw && !playerA) ? 'A' : 'D';
        for (const id of result.deadGenerals || []) {
          [...sideA, ...sideD].forEach((a) => { if (a.general === id) killGeneral(a, true); });
        }
        fieldCasualtiesApplied = true;
        // clean up empty units (battle mutated unit.men directly)
        [...sideA, ...sideD].forEach((a) => { a.units = a.units.filter((u) => u.men >= Math.max(15, u.max * 0.05)); });
      }
    }
    if (!fieldCasualtiesApplied) {
      const rA = sidePower(sideA, fortSideIsA ? 1 + 0.12 * ps.fort : 1) * (0.85 + rnd() * 0.3);
      const rD = sidePower(sideD, (TERRAIN_DEF[terr] || 1) * (fortSideIsD ? 1 + 0.12 * ps.fort : 1)) * (0.85 + rnd() * 0.3);
      winner = rA > rD ? 'A' : 'D';
      const k = Math.min(rA, rD) / Math.max(rA, rD, 1);
      const winLoss = 0.07 + 0.22 * k, loseLoss = 0.32 + 0.45 * (1 - k);
      applyCasualties(winner === 'A' ? sideA : sideD, winLoss);
      applyCasualties(winner === 'A' ? sideD : sideA, loseLoss);
      for (const a of winner === 'A' ? sideD : sideA) if (a.general && rnd() < 0.12) killGeneral(a);
    }
    const win = winner === 'A' ? sideA : sideD, lose = winner === 'A' ? sideD : sideA;
    const loseFacs = winner === 'A' ? facsD : facsA, winFacs = winner === 'A' ? facsA : facsD;
    award(win, true); award(lose, false);
    for (const f of winFacs) S.factions[f].wonBattles++;
    for (const f of loseFacs) S.factions[f].lostBattles++;
    for (const f of winFacs) for (const e of loseFacs) addScore(f, e, 5);
    const name = C.def(prov).name;
    const lead = (arr) => F(arr[0].owner).adj;
    plog(`Battle of ${name}: ${F(win[0].owner).name} defeats ${F(lose[0].owner).name}${choice === 'fight' ? '' : ' (auto-resolved)'}.`,
      win.some((a) => a.owner === S.player) ? 'good' : 'bad', [...facsA, ...facsD]);
    if (!involved) C.log(`Battle of ${name}: ${F(win[0].owner).adj} victory over the ${F(lose[0].owner).adj}.`, 'battle-minor');
    // retreat losers
    const enemyFacs = winFacs;
    for (const a of lose.slice()) {
      if (!a.units.length) { removeArmy(a); continue; }
      const origin = a === attacker ? from : null;
      retreat(a, origin, enemyFacs);
    }
    // empty winners
    for (const a of win.slice()) if (!a.units.length) removeArmy(a);
    if (winner === 'A' && S.armies.includes(attacker)) { attacker.prov = prov; attacker.path = attacker.path.filter((x) => x !== prov); }
    if (winner === 'D' && S.armies.includes(attacker)) { /* already retreated */ }
    return winner;
  }
  function mkSide(armies) {
    const units = [];
    armies.forEach((a) => a.units.forEach((u) => units.push({ ref: u, type: u.type, men: u.men, max: u.max, faction: a.owner, vet: C.vetOf(u), fatigue: Math.min(60, (a.fatigue || 0) * 0.7) })));
    const g = genBonus(armies);
    return {
      faction: armies[0].owner, armies, units,
      general: g ? { id: g.id, name: g.name, atk: g.atk, def: g.def, lead: g.lead, trait: g.trait, traits: g.traits || [] } : null,
      staff: [...new Set(armies.map((a) => a.staff).filter(Boolean))]
    };
  }

  // -------------------------------------------------------------------- turn processing
  async function stepArmy(a, second) {
    if (!S.armies.includes(a) || !a.path.length) return;
    a.moved = true;
    const dest = a.path[0];
    if (!canEnter(a.owner, dest) || !nbrs(a.owner, a.prov).includes(dest)) { a.path = []; return; }
    const from = a.prov;
    const sea = isSea(from, dest);
    a.path.shift();
    (S.moveLog = S.moveLog || []).push({ id: a.id, from, to: dest });
    a.from = from;
    if (sea && a.units.length > SEA_CAP) { plog(`The ${F(a.owner).adj} army is too large to sail (max ${SEA_CAP} regiments).`, 'bad', [a.owner]); a.path = []; a.from = from; return; }
    if (sea && C.seaBlocked(a.owner, from, dest)) { plog(`An enemy fleet bars the ${F(a.owner).adj} army from sailing from ${C.def(from).name}.`, 'bad', [a.owner]); a.path = []; a.from = from; return; }
    const enemies = S.armies.filter((x) => x.prov === dest && atWar(x.owner, a.owner));
    if (enemies.length) {
      const prevProv = a.prov;
      await resolveBattle(a, dest, from);
      return;
    }
    a.prov = dest;
    if (S.provinces[dest].siege && S.provinces[dest].siege.by !== a.owner && atWar(S.provinces[dest].siege.by, a.owner)) {
      // relief army breaks siege
      S.provinces[dest].siege = null;
    }
    if (a.forced && !second && a.path.length && S.armies.includes(a)) {
      const nxt = a.path[0];
      if (!S.armies.some((x) => x.prov === nxt && atWar(x.owner, a.owner)) && S.provinces[dest].owner !== 'x') {
        applyCasualties([a], 0.03); a.forcedMarch = true;
        await stepArmy(a, true);
      }
    }
  }

  // A column that marches into the province an enemy army has just left catches its rearguard: a free blow for the pursuer.
  function pursuit() {
    const log = S.moveLog || []; S.moveLog = [];
    const arm = (id) => S.armies.find((x) => x.id === id);
    const cav = (a) => a.units.filter((u) => U[u.type].cls === 'cav').length / Math.max(1, a.units.length);
    for (const m of log) {
      const A = arm(m.id); if (!A) continue;
      for (const o of log) {
        const B = arm(o.id); if (!B || B === A || !atWar(A.owner, B.owner)) continue;
        if (o.from !== m.to || o.to === m.to || A.prov !== m.to) continue; // B left the province A entered
        if (B.prov === A.prov) continue;
        if (rnd() < 0.55 + 0.25 * cav(A) - 0.25 * cav(B)) {
          applyCasualties([B], 0.06); B.fatigue = Math.min(100, (B.fatigue || 0) + 15);
          plog(`The ${F(A.owner).adj} army overtakes the rearguard of the ${F(B.owner).adj} army leaving ${C.def(m.to).name}.`, A.owner === S.player ? 'good' : B.owner === S.player ? 'bad' : 'info-minor', [A.owner, B.owner]);
        }
      }
    }
  }
  function siegePhase(f) {
    for (const p of W().provs) {
      const ps = S.provinces[p.id];
      const mine = S.armies.filter((a) => a.prov === p.id && a.owner === f);
      if (!mine.length) continue;
      if (!atWar(f, ps.owner)) continue;
      if (S.armies.some((a) => a.prov === p.id && atWar(a.owner, f))) continue; // contested
      const arty = mine.reduce((s, a) => s + a.units.filter((u) => u.type === 'art').length, 0);
      const power = (arty >= 2 ? 2 : 1) + (arty >= 5 ? 1 : 0) + (mine.some((a) => a.staff === 'gunner' || a.staff === 'engineer') ? 1 : 0);
      if (!ps.siege || ps.siege.by !== f) ps.siege = { by: f, progress: power };
      else ps.siege.progress += power;
      if (ps.siege.progress > ps.fort) captureProvince(p.id, f);
      else plog(`${F(f).adj} forces besiege ${p.name} (${ps.siege.progress}/${ps.fort + 1}).`, 'info', [f, ps.owner]);
    }
    // clear sieges with no besieger
    for (const p of W().provs) {
      const ps = S.provinces[p.id];
      if (ps.siege && !S.armies.some((a) => a.prov === p.id && a.owner === ps.siege.by)) ps.siege = null;
    }
  }

  function captureProvince(pid, f) {
    const ps = S.provinces[pid], old = ps.owner, d = C.def(pid);
    ps.owner = f; ps.siege = null; ps.queue = []; ps.shipQueue = []; ps.build = null; ps.policy = 'balanced';
    if (rnd() < 0.5) ps.shipyard = 0;
    ps.unrest = d.owner === f ? 10 : 35;
    addScore(f, old, 10 + Math.round(d.income) + (d.capital ? 25 : 0));
    for (const b of ['market', 'barracks', 'stables', 'arsenal', 'academy']) if (rnd() < 0.45) ps[b] = 0;
    if (!ps.barracks) ps.academy = 0;
    plog(`${F(f).name} captures ${d.name} from ${F(old).name}!`, f === S.player ? 'good' : 'bad', [f, old]);
    if (f !== S.player && old !== S.player) C.log(`${d.name} falls to ${F(f).adj} forces.`, 'capture-minor');
    if (S.factions[old].cap === pid && old !== 'minor') {
      const loot = Math.round(Math.max(0, S.factions[old].gold) * 0.25);
      S.factions[old].gold -= loot; S.factions[f].gold += loot;
      plog(`The capital of ${F(old).name} has fallen! ${loot} gold is looted.`, f === S.player ? 'good' : 'bad', [f, old]);
    }
    if (!C.provincesOf(old).length) eliminate(old);
    NAP.recolor(S);
  }
  function eliminate(f) {
    const fs = S.factions[f];
    if (!fs.alive) return;
    fs.alive = false;
    plog(`${F(f).name} has been eliminated!`, f === S.player ? 'bad' : 'war', null);
    for (const a of S.armies.filter((x) => x.owner === f)) removeArmy(a);
    for (const k of Object.keys(S.wars)) if (k.split('|').includes(f)) delete S.wars[k];
    for (const k of Object.keys(S.allies)) if (k.split('|').includes(f)) delete S.allies[k];
  }

  // distance (in provinces) from friendly soil; 0 = at home
  function supplyDepth(a) {
    const home = (id) => { const o = S.provinces[id].owner; return o === a.owner || allied(a.owner, o); };
    if (home(a.prov)) return 0;
    let q = [a.prov], seen = new Set(q), d = 0;
    while (q.length && d < 4) {
      d++; const nq = [];
      for (const cur of q) for (const i of W().byId[cur].adj) {
        const id = W().provs[i].id; if (seen.has(id)) continue; seen.add(id);
        if (home(id)) return d; nq.push(id);
      }
      q = nq;
    }
    return 4;
  }
  C.supplyDepth = supplyDepth;
  // route (province ids) from the army back to the nearest friendly province; [] when at home
  C.supplyPath = function (a) {
    const home = (id) => { const o = S.provinces[id].owner; return o === a.owner || allied(a.owner, o); };
    if (home(a.prov)) return [];
    const prev = { [a.prov]: null }; let q = [a.prov];
    for (let d = 0; d < 6 && q.length; d++) {
      const nq = [];
      for (const cur of q) for (const i of W().byId[cur].adj) {
        const id = W().provs[i].id; if (id in prev) continue; prev[id] = cur;
        if (home(id)) { const path = [id]; let c = cur; while (c) { path.unshift(c); c = prev[c]; } return path.reverse().reverse(); }
        nq.push(id);
      }
      q = nq;
    }
    return [];
  };
  // things the player should look at before ending the turn
  C.attention = function (f) {
    const out = [], fs = S.factions[f], warNow = wars(f).length > 0;
    for (const a of C.armiesOf(f)) {
      const ps = S.provinces[a.prov], nm = C.def(a.prov).name, home = ps.owner === f || allied(f, ps.owner), besieging = ps.siege && ps.siege.by === f;
      if (!a.path.length && !besieging && !home) out.push({ kind: 'idle', sev: 2, army: a.id, prov: a.prov, text: `${a.units.length}-regiment army idle in ${nm}` });
      else if (!a.path.length && home && warNow && a.units.length >= 8) out.push({ kind: 'idle-home', sev: 1, army: a.id, prov: a.prov, text: `Large army (${a.units.length} regts) waiting in ${nm}` });
      { const n = a.units.filter(C.canUpgrade).length; if (n) out.push({ kind: 'upgrade', sev: 1, army: a.id, prov: a.prov, text: `${n} militia in ${nm} can be upgraded to Line Infantry for free` }); }
      if ((a.supply || 0) >= 2) out.push({ kind: 'supply', sev: 2, army: a.id, prov: a.prov, text: `Army in ${nm} is short of supply` });
      if (!a.general && a.units.length >= 5 && C.availableGenerals(f).length) out.push({ kind: 'general', sev: 1, army: a.id, prov: a.prov, text: `Army in ${nm} has no general (one is available)` });
    }
    for (const p of C.provincesOf(f)) {
      const ps = S.provinces[p.id];
      if (ps.siege) out.push({ kind: 'siege', sev: 3, prov: p.id, text: `${p.name} is under siege` });
      if ((ps.unrest || 0) >= 60) out.push({ kind: 'unrest', sev: 3, prov: p.id, text: `Unrest in ${p.name} is ${Math.round(ps.unrest)}%` });
    }
    for (const p of C.provincesOf(f)) if (S.provinces[p.id].blockade) out.push({ kind: 'blockade', sev: 2, prov: p.id, text: `${p.name} is blockaded by an enemy fleet` });
    if (fs.gold > 1000) out.push({ kind: 'gold', sev: 1, prov: fs.cap, text: `${Math.round(fs.gold).toLocaleString('en-US')} gold unspent` });
    if (warNow && fs.gold > 500 && fs.manpower > 1000) {
      const empty = C.provincesOf(f).filter((p) => !S.provinces[p.id].queue.length && !S.provinces[p.id].siege).length;
      if (empty >= 3) out.push({ kind: 'queue', sev: 1, prov: fs.cap, text: `At war with ${Math.round(fs.gold)} gold in the treasury, but ${empty} provinces are recruiting nothing` });
    }
    return out.sort((x, y) => y.sev - x.sev);
  };
  function attrition() {
    const month = S.month;
    for (const a of S.armies.slice()) {
      const ps = S.provinces[a.prov], d = C.def(a.prov);
      let loss = 0;
      const home = ps.owner === a.owner || allied(a.owner, ps.owner);
      const depth = supplyDepth(a); a.supply = depth;
      const gen = a.general ? S.generals[a.general] : null, winter = month === 12 || month <= 2;
      let mult = (C.hasTrait(gen, 'logistician') ? 0.7 : 1) * (a.staff === 'quartermaster' ? 0.75 : 1) * NAP.perk(a.owner, 'attrition');
      if (!home) loss += 0.012 * (1 + a.units.length / 12) * (depth <= 1 ? 1.5 : depth === 2 ? 2.2 : 3.2);
      if (!home && winter) loss += 0.02 + (d.terrain === 'm' ? 0.02 : 0);
      if (!home && d.terrain === 'm') loss += 0.01;
      if ((month === 12 || month <= 2) && d.owner === 'russia' && a.owner !== 'russia' && !allied(a.owner, 'russia')) loss += 0.10;
      if (!home && a.forage) { mult *= 0.4; ps.foraged = true; ps.unrest = Math.min(100, (ps.unrest || 0) + 8); } // living off the land: fewer losses, a ruined province
      loss *= mult;
      // marching fatigue
      if (a.moved) a.fatigue = Math.min(100, (a.fatigue || 0) + (a.forcedMarch ? 38 : 7) * (C.hasTrait(gen, 'logistician') ? 0.7 : 1)); else a.fatigue = Math.max(0, (a.fatigue || 0) - 25 - (a.staff === 'quartermaster' ? 10 : 0));
      a.moved = false; a.forcedMarch = false;
      if (loss > 0) {
        applyCasualties([a], loss);
        if (!a.units.length) { plog(`The ${F(a.owner).adj} army in ${d.name} has melted away from attrition!`, 'bad', [a.owner]); removeArmy(a); }
        else if (loss > 0.08) plog(`Hardship ravages the ${F(a.owner).adj} army in ${d.name}.`, 'bad', [a.owner]);
      } else if (home && !a.path.length) {
        const fs = S.factions[a.owner];
        for (const u of a.units) {
          if (u.men < u.max && fs.manpower > 0) {
            const add = Math.min(u.max - u.men, Math.round(u.max * 0.15), fs.manpower);
            u.men += add; fs.manpower -= add;
          }
        }
      }
    }
  }

  function subsidies() {
    const g = S.factions.britain;
    if (!g || !g.alive || g.gold < 500) return;
    for (const x of alliesOf('britain')) {
      if (!S.factions[x].alive || !wars(x).length || g.gold < 450) continue;
      g.gold -= 70; S.factions[x].gold += 70;
      plog(`British subsidies of 70 gold reach ${F(x).name}.`, 'good', [x, 'britain']);
    }
  }

  const rating = (g) => g.atk + g.def + g.lead;
  function retireGeneral(g) {
    const a = S.armies.find((x) => x.general === g.id); if (a) a.general = null;
    const i = S.pool[g.owner].indexOf(g.id); if (i >= 0) S.pool[g.owner].splice(i, 1);
    g.alive = false; g.retired = true; g.assigned = null;
    plog(`${g.name} resigns his commission in disgust.`, 'bad', [g.owner]);
  }
  function generalsPhase() {
    for (const g of Object.values(S.generals)) {
      if (!g.alive || !g.arrived || !S.factions[g.owner] || !S.factions[g.owner].alive) continue;
      if (g.assigned) { g.idle = 0; g.loyalty = Math.min(100, (g.loyalty || 70) + 0.35); }
      else {
        g.idle = (g.idle || 0) + 1;
        if (g.idle > 8) g.loyalty = (g.loyalty || 70) - 1.2;
        if (C.armiesOf(g.owner).some((a) => a.general && S.generals[a.general] && rating(g) > rating(S.generals[a.general]) + 2)) g.loyalty -= 0.6; // resents a lesser rival
      }
      if (g.loyalty < 38 && !g.warned && g.owner === S.player) { g.warned = true; plog(`${g.name} grumbles about being passed over. Give him a command soon.`, 'bad', [g.owner]); }
      if (g.loyalty <= 15) retireGeneral(g);
    }
  }

  function economyPhase() {
    unrestPhase();
    S.report = {};
    for (const id in S.factions) {
      const fs = S.factions[id]; if (!fs.alive) continue;
      const inc = C.factionIncome(id), up = C.factionUpkeep(id);
      fs.gold += inc - up;
      fs.manpower = Math.min(C.manpowerCap(id), fs.manpower + C.manpowerGain(id));
      if (fs.gold < -300) fs.gold = -300;
      if (fs.gold < 0) {
        const armies = C.armiesOf(id);
        let lost = 0;
        for (const a of armies) {
          for (let i = a.units.length - 1; i >= 0; i--) if (rnd() < 0.12) { a.units.splice(i, 1); lost++; }
          if (!a.units.length) removeArmy(a);
        }
        for (const fl of C.fleetsOf(id)) if (rnd() < 0.3) { const t = fl.ships.frigate ? 'frigate' : 'sol'; if (fl.ships[t]) { fl.ships[t]--; lost++; } }
        dropEmptyFleets();
        if (lost) plog(`${F(id).name} cannot pay its troops! ${lost} regiments desert.`, 'bad', [id]);
      }
      S.report[id] = { income: inc, upkeep: up };
    }
    subsidies();
    shipQueues();
    for (const ps of Object.values(S.provinces)) ps.foraged = false;
    // build queues
    for (const p of W().provs) {
      const ps = S.provinces[p.id];
      if (ps.siege) continue;
      if (ps.build) {
        ps.build.left--;
        if (ps.build.left <= 0) {
          if (ps.build.type === 'fort') ps.fort++; else ps[ps.build.type] = 1;
          plog(`${NAP.BUILDINGS[ps.build.type].name} completed in ${p.name}.`, 'good', [ps.owner]);
          ps.build = null;
        }
      }
      if (ps.queue.length) {
        for (const q of ps.queue) q.left--;
        const done = ps.queue.filter((q) => q.left <= 0);
        ps.queue = ps.queue.filter((q) => q.left > 0);
        if (done.length) {
          const units = done.map((q) => C.newUnit(q.type, q.vet));
          let host = S.armies.find((a) => a.prov === p.id && a.owner === ps.owner && !a.path.length && a.units.length + units.length <= MAX_STACK);
          if (host) host.units.push(...units); else C.makeArmy(ps.owner, p.id, units);
          plog(`${units.length} new regiment(s) raised in ${p.name}.`, 'good', [ps.owner]);
        }
      }
    }
  }

  // -------------------------------------------------------------------- AI
  const WANT = { line: 0.38, light: 0.12, grenadier: 0.07, guard: 0.03, hussar: 0.08, lancer: 0.04, cuirass: 0.07, art: 0.15, hart: 0.03 };
  function threatDist(f, pid, enemies) {
    // Distance from province to nearest enemy-owned province
    const r = C.bfsAll(f, pid, 5).dist;
    let best = 9;
    for (const id in r) if (enemies.includes(S.provinces[id].owner)) best = Math.min(best, r[id]);
    return best;
  }

  function aiRecruit(f) {
    const fs = S.factions[f];
    const en = wars(f);
    const income = C.factionIncome(f);
    let up = C.factionUpkeep(f);
    const own = C.provincesOf(f).filter((p) => !S.provinces[p.id].siege && !S.armies.some((a) => a.prov === p.id && atWar(a.owner, f)));
    if (!own.length) return;
    const counts = {}; let total = 0;
    for (const a of C.armiesOf(f)) for (const u of a.units) { counts[u.type] = (counts[u.type] || 0) + 1; total++; }
    for (const p of own) for (const q of S.provinces[p.id].queue) { counts[q.type] = (counts[q.type] || 0) + 1; total++; }
    const diffMul = S.difficulty === 'hard' ? 1.15 : S.difficulty === 'easy' ? 0.85 : 1;
    const budgetUp = income * (en.length ? (C.provincesOf(f).length <= 4 ? 0.92 : 0.78) : 0.5) * diffMul;
    // militia only evens the odds: raised while outnumbered by the strongest enemy, with cash in hand, and never past a third of the army
    const menOf = (list) => list.reduce((n, a) => n + a.units.reduce((m, u) => m + u.men, 0), 0);
    let myMen = menOf(C.armiesOf(f)) + own.reduce((n, p) => n + S.provinces[p.id].queue.reduce((m, q) => m + U[q.type].men, 0), 0);
    const foeMen = en.reduce((m, e) => (e === 'minor' ? m : Math.max(m, menOf(C.armiesOf(e)))), 0);
    const nMilitia = () => (counts.militia || 0) / Math.max(1, total);
    const evening = () => en.length > 0 && myMen < foeMen * 0.95 && nMilitia() < 0.33 && fs.gold >= 150;
    const want = Object.assign({}, WANT);
    let guard = 0;
    while (guard++ < 5) {
      want.militia = evening() ? 0.4 : 0;
      if (up >= budgetUp) break;
      if (fs.gold < 100 + (en.length ? 0 : 150) && !(want.militia && fs.gold >= 150)) break;
      // pick type with greatest deficit
      let best = null, bd = -9;
      for (const t in want) {
        if (U[t].needs && !own.some((p) => S.provinces[p.id][U[t].needs])) continue;
        const def = want[t] - (counts[t] || 0) / Math.max(1, total);
        if (def > bd && fs.gold >= U[t].cost && fs.manpower >= U[t].men) { bd = def; best = t; }
      }
      if (!best) break;
      // choose province: closest to enemy (or capital when peaceful)
      const cands = own.filter((p) => S.provinces[p.id].queue.length < 3 && (!U[best].needs || S.provinces[p.id][U[best].needs]));
      if (!cands.length) break;
      let pick;
      if (en.length) {
        cands.sort((a, b) => threatDist(f, a.id, en) - threatDist(f, b.id, en) || C.def(b.id).manpower - C.def(a.id).manpower);
        pick = cands[Math.min(cands.length - 1, Math.floor(rnd() * Math.min(3, cands.length)))];
      } else pick = cands[Math.floor(rnd() * cands.length)];
      if (C.recruit(pick.id, best)) break;
      counts[best] = (counts[best] || 0) + 1; total++; up += U[best].upkeep;; myMen += U[best].men;
    }
    for (const p of own) { const ps = S.provinces[p.id]; ps.policy = (ps.unrest || 0) > 35 ? 'order' : fs.gold < 120 ? 'tax' : 'balanced'; }
    // buildings
    if (fs.gold > 450 && rnd() < 0.25) {
      const cands = own.filter((p) => !S.provinces[p.id].build);
      const pick = cands[Math.floor(rnd() * cands.length)];
      if (pick) {
        const ps = S.provinces[pick.id];
        const opts = [];
        if (!ps.market && C.def(pick.id).income >= 4) opts.push('market');
        if (!ps.barracks && C.def(pick.id).manpower >= 3) opts.push('barracks');
        if (!ps.stables && C.def(pick.id).income >= 3 && fs.gold > 500) opts.push('stables');
        if (!ps.arsenal && C.def(pick.id).income >= 4 && fs.gold > 550) opts.push('arsenal');
        if (ps.barracks && !ps.academy && fs.gold > 800) opts.push('academy');
        if (ps.fort < 2 && en.length && threatDist(f, pick.id, en) <= 2) opts.push('fort');
        if (opts.length) C.build(pick.id, opts[Math.floor(rnd() * opts.length)]);
      }
    }
  }

  function aiGenerals(f) {
    for (const a of C.armiesOf(f)) {
      if (a.general) continue;
      const pool = C.availableGenerals(f);
      if (!pool.length) break;
      if (a.units.length < 3) continue;
      pool.sort((x, y) => y.atk + y.def + y.lead - (x.atk + x.def + x.lead));
      C.assignGeneral(a, pool[0].id);
    }
  }

  function aiDiplomacy(f) {
    if (f === 'minor' || (f === S.player && !S.autoplay)) return;
    const aggr = F(f).aggr;
    // peace
    for (const e of wars(f)) {
      const w = S.wars[pkey(f, e)];
      w.exh++;
      const [ok] = C.acceptsPeace(f, e);
      const wantsPeace = (ok && rnd() < 0.35) || w.exh >= 16;
      if (wantsPeace) {
        if (e === S.player) {
          // offer to player (resolved asynchronously by UI)
          if (!S.msgs.some((m) => m.type === 'peace-offer' && m.from === f)) S.msgs.push({ type: 'peace-offer', from: f, demand: C.warScore(f, e) >= 25 ? Math.min(250, Math.max(0, Math.floor(S.factions[e].gold / 2))) : 0 });
        } else if (C.acceptsPeace(e, f)[0] || w.exh >= 14 || (w.exh >= 8 && rnd() < 0.3)) makePeace(f, e);
      }
    }
    // alliances against common enemies
    for (const e of wars(f)) {
      for (const x of Object.keys(S.factions)) {
        if (x === f || x === e || x === 'minor' || !S.factions[x].alive || allied(f, x) || atWar(f, x)) continue;
        if (atWar(x, e) && C.rel(f, x) > -10 && rnd() < 0.18) {
          if (x === S.player) { if (!S.msgs.some((m) => m.type === 'alliance-offer' && m.from === f)) S.msgs.push({ type: 'alliance-offer', from: f }); }
          else makeAlliance(f, x);
        }
      }
    }
    // treaties: trade deals and royal marriages
    if (rnd() < 0.025) {
      const others = Object.keys(S.factions).filter((x) => x !== f && x !== 'minor' && S.factions[x].alive && !atWar(f, x) && C.rel(f, x) > 10 && !C.hasTreaty('trade', f, x));
      if (others.length) {
        const x = others[Math.floor(rnd() * others.length)];
        if (x === S.player) { if (!S.msgs.some((m) => m.type === 'trade-offer' && m.from === f)) S.msgs.push({ type: 'trade-offer', from: f }); } else C.makeTreaty('trade', f, x);
      }
    }
    if (rnd() < 0.008) for (const x of alliesOf(f)) if (x !== S.player && x !== 'minor' && C.rel(f, x) >= 40 && !C.hasTreaty('marriage', f, x)) { C.makeTreaty('marriage', f, x); break; }
    // declare war
    if (S.turn < 4) return;
    const engaged = wars(f).filter((x) => x !== 'minor').length;
    if (engaged >= 2) return;
    if (rnd() > 0.045 * aggr * (S.difficulty === 'hard' ? 1.3 : S.difficulty === 'easy' ? 0.7 : 1)) return;
    const myP = factionPower(f) + alliesOf(f).reduce((s, x) => s + factionPower(x) * 0.5, 0);
    let best = null, bs = 0;
    for (const e of Object.keys(S.factions)) {
      if (e === f || !S.factions[e].alive || allied(f, e) || atWar(f, e)) continue;
      if (S.truce && S.truce[pkey(f, e)] > S.turn) continue;
      // neighbours?
      let near = false;
      for (const p of C.provincesOf(f)) {
        const d = C.def(p.id);
        if (d.adj.some((i) => S.provinces[W().provs[i].id].owner === e)) { near = true; break; }
      }
      if (!near) continue;
      const theirP = factionPower(e) + alliesOf(e).reduce((s, x) => s + factionPower(x) * 0.7, 0);
      const ratio = (myP + 1) / (theirP + 1);
      if (ratio < 1.15) continue;
      const rl = C.rel(f, e);
      if (rl > 25) continue;
      const score = ratio - rl / 100 + (e === 'minor' ? 0.6 : 0) + (e === S.player ? -0.1 : 0);
      if (score > bs) { bs = score; best = e; }
    }
    if (best) declareWar(f, best, 0, null);
  }

  function aiMoves(f) {
    const en = wars(f).filter((x) => S.factions[x].alive);
    const armies = C.armiesOf(f);
    if (!armies.length) return;
    // merge stacks
    for (const a of armies) {
      if (!S.armies.includes(a)) continue;
      for (const b of armies) {
        if (a === b || !S.armies.includes(b) || a.prov !== b.prov) continue;
        if (a.units.length >= b.units.length && a.units.length + b.units.length <= MAX_STACK && (a.units.length >= 5 || b.units.length < 5 || true)) {
          if (b.units.length < 9 || a.units.length < 9) C.mergeArmies(a, b);
        }
      }
    }
    const list = C.armiesOf(f).sort((x, y) => C.armyPower(y) - C.armyPower(x));
    const enemyArmies = S.armies.filter((a) => en.includes(a.owner));
    if (!en.length) {
      // peace: return home
      for (const a of list) {
        a.path = [];
        if (!canEnter(f, a.prov) || S.provinces[a.prov].owner !== f && !allied(f, S.provinces[a.prov].owner)) {
          const home = C.provincesOf(f)[0];
          if (home) C.orderMove(a, home.id);
        }
      }
      return;
    }
    const mainPower = list.length ? C.armyPower(list[0]) : 0;
    list.forEach((a, idx) => {
      if (!S.armies.includes(a)) return;
      a.path = []; a.forage = (a.supply || 0) >= 2;
      const ps = S.provinces[a.prov];
      const myPow = C.armyPower(a);
      // keep besieging
      if (ps.siege && ps.siege.by === f) {
        const adjThreat = enemyArmies.filter((e) => nbrs(e.owner, e.prov).includes(a.prov)).reduce((s, e) => s + C.armyPower(e), 0);
        if (adjThreat < myPow * 1.6) {
          if (ps.fort >= 1 && !C.assaultCheck(a) && myPow > C.garrisonStrength(a.prov) * 3.2 && rnd() < 0.3) C.assault(a);
          return;
        }
      }
      const { dist, prev } = C.bfsAll(f, a.prov, 6);
      let best = null, bscore = 0;
      for (const id in dist) {
        if (id === a.prov) continue;
        const d = dist[id], q = S.provinces[id], qd = C.def(id);
        const enemiesThere = enemyArmies.filter((e) => e.prov === id);
        const ePow = enemiesThere.reduce((s, e) => s + C.armyPower(e), 0);
        let val = 0;
        if (en.includes(q.owner)) {
          val = 2 + qd.income / 2 + (qd.capital ? 5 : 0) + (S.factions[q.owner].cap === id ? 3 : 0);
          val -= q.fort * (a.units.filter((u) => u.type === 'art').length >= 2 ? 0.8 : 1.6);
          if (q.siege && q.siege.by === f) val += 1;
        } else if (q.owner === f) {
          const near = enemyArmies.filter((e) => e.prov === id || nbrs(e.owner, e.prov).includes(id));
          if (near.length) val = 4 + (qd.capital ? 4 : 0) + qd.income / 3;
        }
        if (ePow > 0) {
          if (myPow < ePow * 0.85) { val = 0; }
          else val += 3 + Math.min(4, (myPow / ePow));
        }
        // friendly stack to join if we're weak
        if (myPow < mainPower * 0.45 && idx > 0) {
          const big = list[0];
          if (id === big.prov) val = Math.max(val, 5);
        }
        // don't wander into minor/neutral lands
        if (!canEnter(f, id)) val = 0;
        if (val <= 0) continue;
        // sea transport only for aggressive navies
        let seaHops = 0; let c = id; while (c && prev[c]) { if (isSea(prev[c], c)) seaHops++; c = prev[c]; }
        if (seaHops) {
          if (S.turn < 6 || seaHops > 1 || a.units.length > SEA_CAP || a.units.length < 6 || myPow < 4500 || rnd() < 0.6) continue;
        }
        const score = val / (d + 0.6);
        if (score > bscore) { bscore = score; best = id; }
      }
      if (best) {
        const path = []; let c = best; while (c !== a.prov) { path.unshift(c); c = prev[c]; }
        a.path = path;
      } else {
        // retreat toward capital if outnumbered nearby
        const threat = enemyArmies.filter((e) => e.prov === a.prov || nbrs(e.owner, e.prov).includes(a.prov)).reduce((s, e) => s + C.armyPower(e), 0);
        if (threat > myPow * 1.4) {
          const cap = S.factions[f].cap && S.provinces[S.factions[f].cap].owner === f ? S.factions[f].cap : null;
          if (cap) C.orderMove(a, cap);
        }
      }
    });
  }

  C.aiPlan = function (f) {
    if (!S.factions[f].alive || f === 'minor') return;
    aiDiplomacy(f);
    aiRecruit(f);
    aiNavy(f);
    aiGenerals(f);
    if (f !== S.player || S.autoplay) aiMoves(f);
  };

  // -------------------------------------------------------------------- events
  function sameWar(a, b, why) { return declareWar(a, b, 0, why); }
  const alive = (f) => S.factions[f] && S.factions[f].alive;
  function coalition(members, target, label) {
    members.forEach((m) => { if (m !== target && alive(m) && alive(target) && !atWar(m, target) && !allied(m, target) && m !== S.player) sameWar(m, target, label); });
  }
  function spawnUnits(f, pid, spec) {
    const units = parseSpec(spec);
    const a = C.makeArmy(f, pid, units);
    return a;
  }
  function randomOwned(f) { const ps = C.provincesOf(f); return ps.length ? ps[Math.floor(rnd() * ps.length)] : null; }

  C.EVENTS = [
    {
      id: 'coalition3', y: 1805, m: 6, title: 'The Third Coalition',
      text: 'Alarmed by French expansion, Britain, Austria, Russia and their allies form the Third Coalition against Napoleon.',
      players: ['britain', 'austria', 'russia', 'sweden', 'naples'], target: 'france',
      choices: (S) => [{ label: 'Join the coalition (declare war on France, +200 gold)', run: () => { sameWar(S.player, 'france', 'Third Coalition'); S.factions[S.player].gold += 200; } }, { label: 'Stay neutral', run: () => {} }],
      run: () => coalition(['britain', 'austria', 'russia', 'sweden', 'naples'], 'france', 'Third Coalition')
    },

      text: 'Nelson destroys the Franco-Spanish fleet off Cape Trafalgar. British trade and supply routes are secure; French and Spanish overseas commerce suffers.',

        if (!atWar('britain', 'france') && !atWar('britain', 'spain')) return;

        S.factions.france.gold -= 100; S.factions.spain.gold -= 150;
      }
    },
    {

      text: 'The German states of the Rhine renounce the Holy Roman Empire and place themselves under French protection.',
      run: () => { if (alive('bavaria') && alive('france') && !allied('france', 'bavaria') && !atWar('france', 'bavaria') && S.player !== 'bavaria') makeAlliance('france', 'bavaria'); }
    },
    {
      id: 'continental', y: 1806, m: 11, title: 'The Continental System',
      text: 'Napoleon\'s Berlin Decree closes European ports to British trade. Britain\'s commerce suffers, but so does the trade of the continent.',
      run: () => { S.factions.britain.incomeMult *= 0.88; for (const f of ['france', 'prussia', 'denmark', 'russia', 'spain']) if (alive(f)) S.factions[f].incomeMult *= 0.96; }
    },
    {

      text: 'Outraged by French meddling in Germany, Prussia moves toward war with France.',
      cond: () => alive('prussia') && alive('france') && S.player !== 'prussia' && !atWar('prussia', 'france') && !allied('prussia', 'france'),
      run: () => { sameWar('prussia', 'france', 'Fourth Coalition'); if (alive('russia') && S.player !== 'russia') sameWar('russia', 'france', 'Fourth Coalition'); }

      choices: () => [{ label: 'Sign the treaty (peace)', run: () => { makePeace('russia', 'france'); } }, { label: 'Fight on', run: () => {} }],
      run: () => { if (S.player === 'russia' || S.player === 'france') return; if (atWar('russia', 'france')) { makePeace('russia', 'france'); if (rnd() < 0.5) makeAlliance('russia', 'france'); } }
    },
    {

    {

      text: 'The people of Madrid rise against the French. Juntas form across Spain; guerrilla bands harass the occupiers.',
      cond: () => alive('france') && alive('spain'),
